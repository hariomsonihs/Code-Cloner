<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercises - Code Cloner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <script src="env-config.js"></script>
  <style>
    body {
      background:
        radial-gradient(circle at 8% 0%, #eaf4ff 0%, transparent 26%),
        radial-gradient(circle at 94% 8%, #ffeedf 0%, transparent 30%),
        #f5f8fc;
    }
    .courses-hero {
      background: linear-gradient(132deg, #5f83ff 0%, #3cc8a7 100%);
      padding: 2rem 1.2rem 1.8rem;
      margin-bottom: 1.4rem;
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 20px 44px rgba(67, 102, 170, 0.22);
    }
    .breadcrumb {
      max-width: 1080px;
      margin: 0 auto 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.8rem;
      font-weight: 500;
    }
    .breadcrumb a {
      color: rgba(255,255,255,0.86);
      text-decoration: none;
    }
    .breadcrumb a:hover { color: #fff; }
    .breadcrumb span { color: rgba(255,255,255,0.74); }
    .course-header {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 1rem;
      color: white;
    }
    .course-icon-large {
      font-size: 2.5rem;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      width: 84px;
      height: 84px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.34);
    }
    .course-info h1 {
      font-size: clamp(1.38rem, 2.9vw, 2rem);
      margin: 0 0 0.3rem 0;
      font-weight: 700;
      line-height: 1.22;
    }
    .course-info p {
      font-size: 0.92rem;
      margin: 0;
      opacity: 0.94;
      max-width: 720px;
    }
    .exercises-container {
      width: 100%;
      max-width: none;
      margin: 0;
      padding: 0 0 3.2rem;
    }
    .exercises-grid {
      display: flex;
      flex-direction: column;
      gap: 0.62rem;
      width: 100%;
    }
    .exercise-card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 14px;
      padding: 0.75rem 0.82rem;
      text-decoration: none;
      color: inherit;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 0.7rem;
      min-height: 74px;
      transition: all 0.22s ease;
      box-shadow: 0 10px 24px rgba(58, 84, 127, 0.12);
      border: 1px solid rgba(93, 124, 180, 0.2);
      position: relative;
      overflow: hidden;
    }
    .exercise-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 30px rgba(58, 84, 127, 0.18);
      border-color: rgba(95, 131, 255, 0.4);
    }
    .exercise-card::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, #5f83ff, #3cc8a7);
      opacity: 0.95;
    }
    .exercise-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      background: rgba(95, 131, 255, 0.12);
      color: #2f4c8d;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.78rem;
      border: 1px solid rgba(95, 131, 255, 0.25);
      flex-shrink: 0;
    }
    .exercise-main {
      min-width: 0;
    }
    .exercise-topic {
      display: inline-flex;
      margin-bottom: 0.24rem;
      padding: 0.16rem 0.5rem;
      border-radius: 999px;
      font-size: 0.7rem;
      color: #4b5f8a;
      background: #eef3ff;
      border: 1px solid #d7e2ff;
      width: fit-content;
    }
    .exercise-title {
      font-size: 0.98rem;
      font-weight: 600;
      margin: 0 0 0.16rem;
      color: #13233f;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .exercise-meta {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-top: 0;
      padding-top: 0;
      border-top: 0;
      font-size: 0.74rem;
      color: #5d7197;
      font-weight: 500;
    }
    .exercise-arrow {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: rgba(95, 131, 255, 0.1);
      color: #2f4c8d;
      border: 1px solid rgba(95, 131, 255, 0.22);
      font-size: 0.95rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(58, 84, 127, 0.14);
    }
    .empty-icon { font-size: 4rem; margin-bottom: 1rem; }
    @media (max-width: 768px) {
      .courses-hero {
        border-radius: 18px;
        padding: 1rem 0.85rem 1.05rem;
      }
      .course-header {
        flex-direction: row;
        align-items: flex-start;
        text-align: left;
      }
      .course-icon-large {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        font-size: 1.5rem;
      }
      .course-info h1 { font-size: 1.15rem; }
      .course-info p { font-size: 0.82rem; }
      .exercises-container { padding: 0 0 2.6rem; }
      .exercise-card {
        min-height: 68px;
        padding: 0.66rem 0.66rem;
        gap: 0.58rem;
      }
      .exercise-number {
        width: 32px;
        height: 32px;
        font-size: 0.72rem;
      }
      .exercise-title { font-size: 0.9rem; }
      .exercise-meta { font-size: 0.7rem; }
      .exercise-arrow {
        width: 26px;
        height: 26px;
        font-size: 0.84rem;
      }
    }
  </style>
</head>
<body data-page="exercises">
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>
  <div class="bg-orb orb-c"></div>

  <div class="drawer-overlay" id="drawerOverlay"></div>
  <aside class="side-drawer" id="sideDrawer">
    <div class="drawer-top">
      <div class="brand"><img src="/code_cloner_logo.jpeg" alt="Logo" class="brand-logo"/><div><strong>Code Cloner</strong><small>Learning Hub</small></div></div>
      <button class="icon-btn" id="closeDrawer">
        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="drawer-section-label">Navigation</div>
    <nav class="drawer-nav">
      <a href="index.html" class="nav-link"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg>Home</a>
      <a href="articles.html" class="nav-link"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>Articles</a>
      <a href="learning.html" class="nav-link" style="background:rgba(102,126,234,0.1);color:var(--brand-2);font-weight:600"><svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>Learning</a>
      <a href="search.html" class="nav-link"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Search</a>
    </nav>
  </aside>

  <header class="topbar">
    <a class="brand" href="index.html"><img src="/code_cloner_logo.jpeg" alt="Logo" class="brand-logo"/><div><strong>Code Cloner</strong><small>Learning Hub</small></div></a>
    <nav class="desktop-nav">
      <a href="index.html" class="nav-link"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg>Home</a>
      <a href="articles.html" class="nav-link"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>Articles</a>
      <a href="learning.html" class="nav-link" style="color:var(--brand-2);font-weight:600"><svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>Learning</a>
      <a href="search.html" class="nav-link"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Search</a>
    </nav>
    <button class="icon-btn menu-btn" id="openDrawer">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
    </button>
  </header>

  <div class="courses-hero">
    <div class="breadcrumb">
      <a href="learning.html">Learning Hub</a>
      <span>/</span>
      <a href="#" id="breadCategory">Category</a>
      <span>/</span>
      <span id="courseName">Course</span>
    </div>
    <div class="course-header" id="courseHeader">
      <div class="course-icon-large" id="courseIcon">📘</div>
      <div class="course-info">
        <h1 id="courseTitle">Loading...</h1>
        <p id="courseDesc"></p>
      </div>
    </div>
  </div>

  <div class="exercises-container">
    <div class="exercises-grid" id="exercisesGrid">
      <div style="text-align:center;padding:2rem;color:#999">Loading exercises...</div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21H3z" /></svg><span>Home</span></a>
    <a href="articles.html"><svg viewBox="0 0 24 24"><path d="M5 5h14v14H5zM8 9h8M8 12h8M8 15h5" /></svg><span>Articles</span></a>
    <a href="learning.html" style="color:var(--brand-2)"><svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><span>Learning</span></a>
    <a href="projects.html"><svg viewBox="0 0 24 24"><path d="M4 7h16v10H4zM9 7V5h6v2" /></svg><span>Projects</span></a>
    <a href="profile.html"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Profile</span></a>
  </nav>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getFirestore, collection, getDocs, doc, getDoc, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    const firebaseConfig = window.__env || {};
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const categoryId = urlParams.get('category');
    const courseId = urlParams.get('course');

    function parseOrder(value) {
      const numeric = Number(value);
      return Number.isFinite(numeric) ? numeric : 0;
    }

    function sortDocsByOrder(docs) {
      return [...docs].sort((a, b) => parseOrder(a.data()?.order) - parseOrder(b.data()?.order));
    }

    async function loadCourse() {
      if (!categoryId || !courseId) {
        window.location.href = 'learning.html';
        return;
      }

      try {
        const catDoc = await getDoc(doc(db, 'learning_categories', categoryId));
        const courseDoc = await getDoc(doc(db, `learning_categories/${categoryId}/courses`, courseId));

        if (!catDoc.exists() || !courseDoc.exists()) {
          window.location.href = 'learning.html';
          return;
        }

        const cat = catDoc.data();
        const course = courseDoc.data();

        document.getElementById('breadCategory').textContent = cat.name;
        document.getElementById('breadCategory').href = `courses.html?category=${categoryId}`;
        document.getElementById('courseName').textContent = course.name;
        document.getElementById('courseTitle').textContent = course.name;
        document.getElementById('courseDesc').textContent = course.description || '';
        document.getElementById('courseIcon').textContent = course.icon || '📘';
        document.title = `${course.name} - Code Cloner`;
      } catch (error) {
        console.error('Error loading course:', error);
      }
    }

    async function loadDirectExercises() {
      const orderedQuery = query(
        collection(db, `learning_categories/${categoryId}/courses/${courseId}/exercises`),
        orderBy('order', 'asc')
      );
      const snapshot = await getDocs(orderedQuery);

      return snapshot.docs.map((exerciseDoc) => {
        const exercise = exerciseDoc.data();
        return {
          urlId: exerciseDoc.id,
          title: exercise.title || 'Untitled Exercise',
          views: exercise.views || 0,
          topicName: ''
        };
      });
    }

    async function loadLegacyExercises() {
      const topicsSnapshot = await getDocs(
        collection(db, `learning_categories/${categoryId}/courses/${courseId}/topics`)
      );
      const topicDocs = sortDocsByOrder(topicsSnapshot.docs);
      const legacyExercises = [];

      for (const topicDoc of topicDocs) {
        const topic = topicDoc.data();
        const exerciseSnapshot = await getDocs(
          collection(db, `learning_categories/${categoryId}/courses/${courseId}/topics/${topicDoc.id}/exercises`)
        );
        const exerciseDocs = sortDocsByOrder(exerciseSnapshot.docs);

        for (const exerciseDoc of exerciseDocs) {
          const exercise = exerciseDoc.data();
          legacyExercises.push({
            urlId: `${topicDoc.id}__${exerciseDoc.id}`,
            title: exercise.title || 'Untitled Exercise',
            views: exercise.views || 0,
            topicName: topic.name || ''
          });
        }
      }

      return legacyExercises;
    }

    async function loadExercises() {
      const grid = document.getElementById('exercisesGrid');

      try {
        let exercises = await loadDirectExercises();
        if (!exercises.length) {
          exercises = await loadLegacyExercises();
        }

        if (!exercises.length) {
          grid.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">💪</div>
              <h3>No exercises yet</h3>
              <p>Exercises will be added soon!</p>
            </div>
          `;
          return;
        }

        grid.innerHTML = '';

        exercises.forEach((exercise, index) => {
          const card = document.createElement('a');
          card.href = `exercise.html?category=${categoryId}&course=${courseId}&exercise=${encodeURIComponent(exercise.urlId)}`;
          card.className = 'exercise-card';
          card.innerHTML = `
            <div class="exercise-number">${index + 1}</div>
            <div class="exercise-main">
              ${exercise.topicName ? `<span class="exercise-topic">${exercise.topicName}</span>` : ''}
              <h3 class="exercise-title">${exercise.title}</h3>
              <div class="exercise-meta">
                <span>👁️ ${exercise.views} views</span>
              </div>
            </div>
            <span class="exercise-arrow" aria-hidden="true">→</span>
          `;
          grid.appendChild(card);
        });
      } catch (error) {
        console.error('Error loading exercises:', error);
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">❌</div>
            <h3>Error loading exercises</h3>
            <p>${error.message}</p>
          </div>
        `;
      }
    }

    const openDrawer = document.getElementById('openDrawer');
    const closeDrawer = document.getElementById('closeDrawer');
    const drawer = document.getElementById('sideDrawer');
    const overlay = document.getElementById('drawerOverlay');

    if (openDrawer) {
      openDrawer.addEventListener('click', () => {
        drawer.classList.add('open');
        overlay.classList.add('show');
      });
    }

    if (closeDrawer) {
      closeDrawer.addEventListener('click', () => {
        drawer.classList.remove('open');
        overlay.classList.remove('show');
      });
    }

    if (overlay) {
      overlay.addEventListener('click', () => {
        drawer.classList.remove('open');
        overlay.classList.remove('show');
      });
    }

    loadCourse();
    loadExercises();
  </script>
</body>
</html>
