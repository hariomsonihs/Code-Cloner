<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercises - Code Cloner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <script src="env-config.js"></script>
  <style>
    body {
      background:
        radial-gradient(circle at 8% 0%, #eaf4ff 0%, transparent 26%),
        radial-gradient(circle at 94% 8%, #ffeedf 0%, transparent 30%),
        #f5f8fc;
    }
    .courses-hero {
      background: linear-gradient(132deg, #5f83ff 0%, #3cc8a7 100%);
      padding: 2rem 1.2rem 1.8rem;
      margin-bottom: 1.4rem;
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 20px 44px rgba(67, 102, 170, 0.22);
    }
    .breadcrumb {
      max-width: 1080px;
      margin: 0 auto 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.8rem;
      font-weight: 500;
    }
    .breadcrumb a {
      color: rgba(255,255,255,0.86);
      text-decoration: none;
    }
    .breadcrumb a:hover { color: #fff; }
    .breadcrumb span { color: rgba(255,255,255,0.74); }
    .course-header {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 1rem;
      color: white;
    }
    .course-icon-large {
      font-size: 2.5rem;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      width: 84px;
      height: 84px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.34);
    }
    .course-info h1 {
      font-size: clamp(1.38rem, 2.9vw, 2rem);
      margin: 0 0 0.3rem 0;
      font-weight: 700;
      line-height: 1.22;
    }
    .course-info p {
      font-size: 0.92rem;
      margin: 0;
      opacity: 0.94;
      max-width: 720px;
    }
    .course-progress {
      margin-top: 0.46rem !important;
      font-size: 0.78rem !important;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.95);
      display: inline-flex;
      padding: 0.18rem 0.52rem;
      border: 1px solid rgba(255, 255, 255, 0.34);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      width: fit-content;
    }
    .exercises-container {
      width: 100%;
      max-width: none;
      margin: 0;
      padding: 0 0 3.2rem;
    }
    .exercises-grid {
      display: flex;
      flex-direction: column;
      gap: 0.62rem;
      width: 100%;
    }
    .exercise-card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 14px;
      padding: 0.75rem 0.82rem;
      text-decoration: none;
      color: inherit;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 0.7rem;
      min-height: 74px;
      transition: all 0.22s ease;
      box-shadow: 0 10px 24px rgba(58, 84, 127, 0.12);
      border: 1px solid rgba(93, 124, 180, 0.2);
      position: relative;
      overflow: hidden;
    }
    .exercise-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 30px rgba(58, 84, 127, 0.18);
      border-color: rgba(95, 131, 255, 0.4);
    }
    .exercise-card.completed {
      border-color: rgba(17, 167, 121, 0.38);
      background: linear-gradient(130deg, rgba(17, 167, 121, 0.08), rgba(22, 185, 164, 0.08));
    }
    .exercise-card.locked {
      cursor: not-allowed;
      background: linear-gradient(130deg, rgba(15, 23, 42, 0.06), rgba(71, 85, 105, 0.09));
      border-color: rgba(71, 85, 105, 0.28);
    }
    .exercise-card.locked:hover {
      transform: none;
      box-shadow: 0 10px 24px rgba(58, 84, 127, 0.12);
      border-color: rgba(71, 85, 105, 0.3);
    }
    .exercise-card::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, #5f83ff, #3cc8a7);
      opacity: 0.95;
    }
    .exercise-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      background: rgba(95, 131, 255, 0.12);
      color: #2f4c8d;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.78rem;
      border: 1px solid rgba(95, 131, 255, 0.25);
      flex-shrink: 0;
    }
    .exercise-main {
      min-width: 0;
    }
    .exercise-topic {
      display: inline-flex;
      margin-bottom: 0.24rem;
      padding: 0.16rem 0.5rem;
      border-radius: 999px;
      font-size: 0.7rem;
      color: #4b5f8a;
      background: #eef3ff;
      border: 1px solid #d7e2ff;
      width: fit-content;
    }
    .exercise-title {
      font-size: 0.98rem;
      font-weight: 600;
      margin: 0 0 0.16rem;
      color: #13233f;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .exercise-meta {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-top: 0;
      padding-top: 0;
      border-top: 0;
      font-size: 0.74rem;
      color: #5d7197;
      font-weight: 500;
    }
    .exercise-arrow {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: rgba(95, 131, 255, 0.1);
      color: #2f4c8d;
      border: 1px solid rgba(95, 131, 255, 0.22);
      font-size: 0.95rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .exercise-arrow.completed {
      background: rgba(17, 167, 121, 0.16);
      border-color: rgba(17, 167, 121, 0.42);
      color: #0f7256;
      font-size: 0.82rem;
    }
    .exercise-arrow.locked {
      background: rgba(71, 85, 105, 0.14);
      border-color: rgba(71, 85, 105, 0.34);
      color: #334155;
      font-size: 0.8rem;
    }
    .exercise-lock-note {
      margin-top: 0.16rem;
      font-size: 0.72rem;
      color: #475569;
      font-weight: 600;
    }
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(58, 84, 127, 0.14);
    }
    .empty-icon { font-size: 4rem; margin-bottom: 1rem; }
    
    /* Tabs Styling */
    .tab-btn.active {
      color: #2f4c8d !important;
      border-bottom-color: #5f83ff !important;
    }
    .tab-btn:hover {
      color: #2f4c8d;
      background: rgba(95, 131, 255, 0.05);
    }
    
    /* Videos Grid */
    .videos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 0.9rem;
      width: 100%;
    }
    .video-card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 14px;
      padding: 0;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      transition: all 0.22s ease;
      box-shadow: 0 10px 24px rgba(58, 84, 127, 0.12);
      border: 1px solid rgba(93, 124, 180, 0.2);
      overflow: hidden;
      width: 100%;
    }
    .video-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 30px rgba(58, 84, 127, 0.18);
      border-color: rgba(95, 131, 255, 0.4);
    }
    .video-thumbnail {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
      overflow: hidden;
      border: none;
      cursor: pointer;
    }
    .video-thumbnail:disabled {
      cursor: not-allowed;
      opacity: 0.86;
    }
    .video-thumb-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.96;
      transition: transform 0.25s ease;
    }
    .video-card:hover .video-thumb-img {
      transform: scale(1.04);
    }
    .video-play-btn {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: rgba(8, 16, 34, 0.78);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      padding: 0.42rem 0.84rem;
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }
    .video-inline-player {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
      display: none;
    }
    .video-inline-player iframe,
    .video-inline-player video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    /* Fullscreen support */
    .video-inline-player:fullscreen,
    .video-inline-player:-webkit-full-screen,
    .video-inline-player:-moz-full-screen,
    .video-inline-player:-ms-fullscreen {
      width: 100vw;
      height: 100vh;
      padding-top: 0;
    }
    .video-inline-player:fullscreen iframe,
    .video-inline-player:-webkit-full-screen iframe,
    .video-inline-player:-moz-full-screen iframe,
    .video-inline-player:-ms-fullscreen iframe,
    .video-inline-player:fullscreen video,
    .video-inline-player:-webkit-full-screen video,
    .video-inline-player:-moz-full-screen video,
    .video-inline-player:-ms-fullscreen video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .video-inline-close {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 5;
      width: 30px;
      height: 30px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: rgba(8, 16, 34, 0.78);
      color: #fff;
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
    }
    .video-info {
      padding: 0.82rem 0.95rem;
    }
    .video-title {
      font-size: 0.98rem;
      font-weight: 600;
      margin: 0 0 0.38rem;
      color: #13233f;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .video-desc {
      font-size: 0.84rem;
      color: #5d7197;
      margin: 0 0 0.52rem;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .video-meta {
      display: flex;
      gap: 0.45rem;
      align-items: center;
      flex-wrap: wrap;
      font-size: 0.74rem;
      color: #5d7197;
    }
    .video-badge {
      display: inline-flex;
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 600;
      background: #eef3ff;
      color: #4b5f8a;
      border: 1px solid #d7e2ff;
    }
    @media (max-width: 1024px) {
      .videos-grid {
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      }
    }
    .video-badge.related {
      background: #e3f2fd;
      color: #1976d2;
      border-color: #bbdefb;
    }
    /* Enroll Button Styles */
    .enroll-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.2rem;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #5f83ff 0%, #3cc8a7 100%);
      color: white;
      font-family: 'Outfit', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(95, 131, 255, 0.3);
    }
    .enroll-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(95, 131, 255, 0.4);
    }
    .enroll-btn.pulse {
      animation: enrollPulse 0.9s ease;
    }
    @keyframes enrollPulse {
      0% { box-shadow: 0 0 0 0 rgba(95, 131, 255, 0.45); }
      100% { box-shadow: 0 0 0 16px rgba(95, 131, 255, 0); }
    }
    .enroll-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .enroll-btn.enrolled {
      background: linear-gradient(135deg, #11a779 0%, #0d6e55 100%);
    }
    .enroll-btn.login-required {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    #enrollmentStatus {
      padding: 0.5rem 0.9rem;
      border-radius: 999px;
      background: rgba(60, 200, 167, 0.1);
      border: 1px solid rgba(60, 200, 167, 0.3);
      color: #0d6e55;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    @media (max-width: 768px) {
      .videos-grid {
        grid-template-columns: 1fr;
        gap: 0.72rem;
      }
      .courses-hero {
        border-radius: 18px;
        padding: 1rem 0.85rem 1.05rem;
      }
      .course-header {
        flex-direction: row;
        align-items: flex-start;
        text-align: left;
      }
      .course-icon-large {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        font-size: 1.5rem;
      }
      .course-info h1 { font-size: 1.15rem; }
      .course-info p { font-size: 0.82rem; }
      .course-progress { font-size: 0.72rem !important; }
      .enroll-btn { width: 100%; justify-content: center; }
      .exercises-container { padding: 0 0 2.6rem; }
      .exercise-card {
        min-height: 68px;
        padding: 0.66rem 0.66rem;
        gap: 0.58rem;
      }
      .exercise-number {
        width: 32px;
        height: 32px;
        font-size: 0.72rem;
      }
      .exercise-title { font-size: 0.9rem; }
      .exercise-meta { font-size: 0.7rem; }
      .exercise-arrow {
        width: 26px;
        height: 26px;
        font-size: 0.84rem;
      }
      .video-thumbnail {
        padding-top: 55%;
      }
      .video-play-btn {
        padding: 0.38rem 0.72rem;
        font-size: 0.72rem;
      }
    }
  </style>
</head>

    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getFirestore, collection, getDocs, doc, getDoc, query, orderBy, setDoc, updateDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';

    const firebaseConfig = window.__env || {};
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const urlParams = new URLSearchParams(window.location.search);
    const categoryId = urlParams.get('category');
    const courseId = urlParams.get('course');
    const lockedParam = urlParams.get('locked');
    const COMPLETION_STORAGE_KEY = 'completedExercises';
    let completedExerciseKeys = new Set();
    let stopActiveInlinePlayer = null;
    let currentUser = null;
    let isEnrolled = false;
    let currentCourse = null;
    let allExercises = [];

    function parseOrder(value) {
      const numeric = Number(value);
      return Number.isFinite(numeric) ? numeric : 0;
    }

    function sortDocsByOrder(docs) {
      return [...docs].sort((a, b) => parseOrder(a.data()?.order) - parseOrder(b.data()?.order));
    }

    function loadCompletedExerciseKeys() {
      try {
        const parsed = JSON.parse(localStorage.getItem(COMPLETION_STORAGE_KEY) || '[]');
        completedExerciseKeys = new Set(Array.isArray(parsed) ? parsed.filter((item) => typeof item === 'string') : []);
      } catch (error) {
        console.error('Error parsing completed exercises:', error);
        completedExerciseKeys = new Set();
      }
    }

    function isExerciseCompleted(urlId) {
      const canonical = `${categoryId}_${courseId}_${urlId}`;
      if (completedExerciseKeys.has(canonical)) return true;

      if (typeof urlId === 'string' && urlId.includes('__')) {
        const [topicId, exerciseId] = urlId.split('__');
        if (topicId && exerciseId) {
          const legacy = `${categoryId}_${courseId}_${topicId}_${exerciseId}`;
          return completedExerciseKeys.has(legacy);
        }
      }
      return false;
    }

    function getCourseRedirectPath() {
      return `exercises.html?category=${encodeURIComponent(categoryId)}&course=${encodeURIComponent(courseId)}`;
    }

    function redirectToLoginForEnrollment() {
      const redirect = encodeURIComponent(getCourseRedirectPath());
      window.location.href = `profile.html?redirect=${redirect}`;
    }

    function handleLockedExerciseClick(event) {
      event.preventDefault();
      const enrollBtn = document.getElementById('enrollBtn');
      if (enrollBtn && !isEnrolled) {
        enrollBtn.scrollIntoView({ behavior: 'smooth', block: 'center' });
        enrollBtn.classList.add('pulse');
        setTimeout(() => enrollBtn.classList.remove('pulse'), 900);
      }
    }

    function getContinueExerciseUrl() {
      if (!allExercises.length) return '';
      const nextExercise = allExercises.find((exercise) => !isExerciseCompleted(exercise.urlId)) || allExercises[0];
      return `exercise.html?category=${encodeURIComponent(categoryId)}&course=${encodeURIComponent(courseId)}&exercise=${encodeURIComponent(nextExercise.urlId)}`;
    }

    function getYouTubeVideoId(url) {
      if (!url) return null;

      try {
        const parsed = new URL(url);
        const host = parsed.hostname.replace(/^www\./, '').replace(/^m\./, '');

        if (host === 'youtu.be') {
          const candidate = parsed.pathname.split('/').filter(Boolean)[0];
          return /^[A-Za-z0-9_-]{11}$/.test(candidate) ? candidate : null;
        }

        if (host.includes('youtube.com') || host.includes('youtube-nocookie.com')) {
          const fromQuery = parsed.searchParams.get('v');
          if (fromQuery && /^[A-Za-z0-9_-]{11}$/.test(fromQuery)) {
            return fromQuery;
          }

          const segments = parsed.pathname.split('/').filter(Boolean);
          const markerIndex = segments.findIndex((part) => ['embed', 'shorts', 'live', 'v'].includes(part));
          if (markerIndex !== -1 && segments[markerIndex + 1] && /^[A-Za-z0-9_-]{11}$/.test(segments[markerIndex + 1])) {
            return segments[markerIndex + 1];
          }
        }
      } catch (error) {
        return null;
      }

      return null;
    }

    function getEmbedPlayerUrl(videoId) {
      const queryParams = new URLSearchParams({
        autoplay: '1',
        rel: '0',
        modestbranding: '1',
        playsinline: '1',
        iv_load_policy: '3'
      });
      return `https://www.youtube-nocookie.com/embed/${videoId}?${queryParams.toString()}`;
    }

    function getGoogleDriveFileId(url) {
      if (!url) return null;
      const raw = String(url).trim();

      const patternMatches = [
        raw.match(/\/file\/d\/([A-Za-z0-9_-]{10,})/),
        raw.match(/[?&]id=([A-Za-z0-9_-]{10,})/),
        raw.match(/\/d\/([A-Za-z0-9_-]{10,})/)
      ];

      for (const match of patternMatches) {
        if (match && match[1]) return match[1];
      }

      try {
        const parsed = new URL(raw);
        const host = parsed.hostname.toLowerCase();
        if (!host.includes('drive.google.com') && !host.includes('docs.google.com')) {
          return null;
        }

        const idFromQuery = parsed.searchParams.get('id');
        if (idFromQuery && /^[A-Za-z0-9_-]{10,}$/.test(idFromQuery)) {
          return idFromQuery;
        }
      } catch (error) {
        return null;
      }

      return null;
    }

    function normalizeGoogleDriveUrl(rawUrl) {
      const fileId = getGoogleDriveFileId(rawUrl);
      if (!fileId) return rawUrl;
      return `https://drive.google.com/file/d/${fileId}/preview`;
    }

    function encodeCloudinaryPublicId(publicId) {
      return String(publicId)
        .split('/')
        .filter(Boolean)
        .map((segment) => encodeURIComponent(segment))
        .join('/');
    }

    function normalizeCloudinaryUrl(rawUrl) {
      if (!rawUrl) return rawUrl;

      try {
        const parsed = new URL(rawUrl);
        const host = parsed.hostname.toLowerCase();
        const path = parsed.pathname.toLowerCase();

        if (host.includes('player.cloudinary.com') && path.includes('/embed')) {
          const cloudName = parsed.searchParams.get('cloud_name');
          const publicId = parsed.searchParams.get('public_id');
          if (cloudName && publicId) {
            const safePublicId = encodeCloudinaryPublicId(publicId);
            return `https://res.cloudinary.com/${encodeURIComponent(cloudName)}/video/upload/${safePublicId}.mp4`;
          }
        }
      } catch (error) {
        return rawUrl;
      }

      return rawUrl;
    }

    function isLikelyDirectVideoUrl(url) {
      if (!url) return false;
      const cleanedUrl = String(url).toLowerCase();
      return /\.(mp4|mov|m4v|webm|ogg|m3u8)(\?|#|$)/i.test(cleanedUrl)
        || cleanedUrl.includes('/video/upload/');
    }

    function getCloudinaryThumbnail(url) {
      if (!url || !String(url).includes('res.cloudinary.com')) return null;
      const noQuery = String(url).split('?')[0];
      return noQuery
        .replace('/video/upload/', '/video/upload/so_1/')
        .replace(/\.(mp4|mov|m4v|webm|ogg|m3u8)$/i, '.jpg');
    }

    function resolveVideoSource(video) {
      const rawUrl = String(video?.url || '').trim();
      const normalizedUrl = normalizeGoogleDriveUrl(normalizeCloudinaryUrl(rawUrl));
      const youtubeId = video?.videoId || getYouTubeVideoId(normalizedUrl) || getYouTubeVideoId(rawUrl);
      const googleDriveFileId = getGoogleDriveFileId(normalizedUrl) || getGoogleDriveFileId(rawUrl);

      if (youtubeId) {
        return {
          type: 'iframe',
          source: getEmbedPlayerUrl(youtubeId),
          thumbnail: `https://i.ytimg.com/vi/${youtubeId}/hqdefault.jpg`
        };
      }

      if (googleDriveFileId) {
        return {
          type: 'iframe',
          source: `https://drive.google.com/file/d/${googleDriveFileId}/preview`,
          thumbnail: `https://drive.google.com/thumbnail?id=${encodeURIComponent(googleDriveFileId)}&sz=w1280`
        };
      }

      if (normalizedUrl && isLikelyDirectVideoUrl(normalizedUrl)) {
        return {
          type: 'direct',
          source: normalizedUrl,
          thumbnail: getCloudinaryThumbnail(normalizedUrl)
        };
      }

      return { type: 'none', source: null, thumbnail: null };
    }

    function stopInlinePlayback() {
      if (typeof stopActiveInlinePlayer === 'function') {
        stopActiveInlinePlayer();
        stopActiveInlinePlayer = null;
      }
    }

    function playVideoInline(video, resolvedSource, thumbnailBtn, inlinePlayer) {
      if (resolvedSource.type === 'none') return;
      stopInlinePlayback();

      thumbnailBtn.style.display = 'none';
      inlinePlayer.style.display = 'block';
      inlinePlayer.innerHTML = '';

      const closeBtn = document.createElement('button');
      closeBtn.type = 'button';
      closeBtn.className = 'video-inline-close';
      closeBtn.setAttribute('aria-label', 'Stop video');
      closeBtn.textContent = '\u00D7';
      inlinePlayer.appendChild(closeBtn);

      let inlineIframe = null;
      let inlineVideo = null;

      if (resolvedSource.type === 'direct') {
        inlineVideo = document.createElement('video');
        inlineVideo.controls = true;
        inlineVideo.playsInline = true;
        inlineVideo.setAttribute('webkit-playsinline', 'true');
        inlineVideo.setAttribute('controlsList', 'nodownload noremoteplayback noplaybackrate');
        inlineVideo.preload = 'metadata';
        inlineVideo.src = resolvedSource.source;
        inlineVideo.autoplay = true;
        inlineVideo.addEventListener('contextmenu', (event) => event.preventDefault());

        if (inlineVideo.controlsList && typeof inlineVideo.controlsList.add === 'function') {
          inlineVideo.controlsList.add('nodownload');
          inlineVideo.controlsList.add('noremoteplayback');
          inlineVideo.controlsList.add('noplaybackrate');
        }

        inlinePlayer.appendChild(inlineVideo);
        const playPromise = inlineVideo.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(() => {});
        }
      } else {
        inlineIframe = document.createElement('iframe');
        inlineIframe.src = resolvedSource.source;
        inlineIframe.title = video.title || 'Course Video';
        inlineIframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen';
        inlineIframe.allowFullscreen = true;
        inlineIframe.setAttribute('allowfullscreen', '');
        inlineIframe.setAttribute('webkitallowfullscreen', '');
        inlineIframe.setAttribute('mozallowfullscreen', '');
        inlinePlayer.appendChild(inlineIframe);
      }

      const cleanup = () => {
        if (inlineIframe) {
          inlineIframe.src = '';
        }
        if (inlineVideo) {
          inlineVideo.pause();
          inlineVideo.removeAttribute('src');
          inlineVideo.load();
        }
        inlinePlayer.innerHTML = '';
        inlinePlayer.style.display = 'none';
        thumbnailBtn.style.display = 'block';
      };

      closeBtn.addEventListener('click', cleanup);
      stopActiveInlinePlayer = cleanup;
    }

    async function loadCourse() {
      if (!categoryId || !courseId) {
        window.location.href = 'learning.html';
        return;
      }

      try {
        const catDoc = await getDoc(doc(db, 'learning_categories', categoryId));
        const courseDoc = await getDoc(doc(db, `learning_categories/${categoryId}/courses`, courseId));

        if (!catDoc.exists() || !courseDoc.exists()) {
          window.location.href = 'learning.html';
          return;
        }

        const cat = catDoc.data();
        const course = courseDoc.data();
        currentCourse = { cat, course };

        document.getElementById('breadCategory').textContent = cat.name;
        document.getElementById('breadCategory').href = `courses.html?category=${categoryId}`;
        document.getElementById('courseName').textContent = course.name;
        document.getElementById('courseTitle').textContent = course.name;
        document.getElementById('courseDesc').textContent = course.description || '';
        document.getElementById('courseIcon').textContent = course.icon || '\u{1F4D6}';
        document.title = `${course.name} - Code Cloner`;
        if (lockedParam) {
          document.getElementById('courseProgress').textContent = 'Locked: Enroll to continue learning';
        }
        
        // Initialize enrollment UI after course loads
        await initEnrollmentUI(cat, course);
      } catch (error) {
        console.error('Error loading course:', error);
      }
    }

    // Enrollment functions
    async function initEnrollmentUI(cat, course) {
      const enrollBtn = document.getElementById('enrollBtn');
      const enrollBtnText = document.getElementById('enrollBtnText');
      const enrollmentStatus = document.getElementById('enrollmentStatus');
      const enrollmentProgress = document.getElementById('enrollmentProgress');

      // Wait for auth state
      currentUser = await new Promise(resolve => {
        const unsubscribe = onAuthStateChanged(auth, user => {
          unsubscribe();
          resolve(user);
        });
      });

      enrollBtn.disabled = false;
      enrollmentStatus.style.display = 'none';

      if (!currentUser) {
        isEnrolled = false;
        enrollBtn.style.display = 'inline-flex';
        enrollBtn.className = 'enroll-btn login-required';
        enrollBtnText.textContent = 'Login to Enroll';
        enrollBtn.onclick = () => redirectToLoginForEnrollment();
        return;
      }

      try {
        const enrollDoc = await getDoc(doc(db, 'users', currentUser.uid, 'enrollments', courseId));
        isEnrolled = enrollDoc.exists();

        if (isEnrolled) {
          const data = enrollDoc.data();
          enrollmentStatus.style.display = 'inline-flex';
          const progress = data.progress || 0;
          const completed = data.completedExercises || 0;
          const total = data.totalExercises || 0;
          enrollmentProgress.textContent = `Enrolled \u2022 ${progress}% (${completed}/${total})`;

          enrollBtn.style.display = 'inline-flex';
          enrollBtn.className = 'enroll-btn enrolled';
          enrollBtnText.textContent = 'Continue Learning';
          enrollBtn.onclick = () => {
            const continueUrl = getContinueExerciseUrl();
            if (!continueUrl) return;
            window.location.href = continueUrl;
          };

          await updateDoc(doc(db, 'users', currentUser.uid, 'enrollments', courseId), {
            lastAccessedAt: serverTimestamp()
          });
        } else {
          enrollBtn.style.display = 'inline-flex';
          enrollBtn.className = 'enroll-btn';
          enrollBtnText.textContent = 'Enroll Now';
          enrollBtn.onclick = () => handleEnrollment(cat, course);
        }
      } catch (error) {
        console.error('Enrollment check error:', error);
        isEnrolled = false;
        enrollBtn.style.display = 'inline-flex';
        enrollBtn.className = 'enroll-btn';
        enrollBtnText.textContent = 'Enroll Now';
        enrollBtn.onclick = () => handleEnrollment(cat, course);
      }
    }

    async function handleEnrollment(cat, course) {
      const enrollBtn = document.getElementById('enrollBtn');
      const enrollBtnText = document.getElementById('enrollBtnText');

      if (!currentUser) {
        redirectToLoginForEnrollment();
        return;
      }

      enrollBtn.disabled = true;
      enrollBtnText.textContent = 'Enrolling...';

      try {
        // Count exercises
        let totalExercises = 0;
        const directEx = await getDocs(collection(db, `learning_categories/${categoryId}/courses/${courseId}/exercises`));
        
        if (directEx.size > 0) {
          totalExercises = directEx.size;
        } else {
          const topicsSnap = await getDocs(collection(db, `learning_categories/${categoryId}/courses/${courseId}/topics`));
          for (const topicDoc of topicsSnap.docs) {
            const exSnap = await getDocs(collection(db, `learning_categories/${categoryId}/courses/${courseId}/topics/${topicDoc.id}/exercises`));
            totalExercises += exSnap.size;
          }
        }

        // Enroll user
        await setDoc(doc(db, 'users', currentUser.uid, 'enrollments', courseId), {
          categoryId,
          categoryName: cat.name,
          courseId,
          courseName: course.name,
          courseIcon: course.icon || '\u{1F4D6}',
          courseDescription: course.description || '',
          enrolledAt: serverTimestamp(),
          lastAccessedAt: serverTimestamp(),
          progress: 0,
          completedExercises: 0,
          totalExercises,
          status: 'active'
        });

        await initEnrollmentUI(cat, course);
        await loadExercises();
      } catch (error) {
        console.error('Enrollment error:', error);
        enrollBtn.disabled = false;
        enrollBtnText.textContent = 'Try Again';
      }
    }

    async function loadDirectExercises() {
      const orderedQuery = query(
        collection(db, `learning_categories/${categoryId}/courses/${courseId}/exercises`),
        orderBy('order', 'asc')
      );
      const snapshot = await getDocs(orderedQuery);

      return snapshot.docs.map((exerciseDoc) => {
        const exercise = exerciseDoc.data();
        return {
          urlId: exerciseDoc.id,
          title: exercise.title || 'Untitled Exercise',
          views: exercise.views || 0,
          topicName: ''
        };
      });
    }

    async function loadLegacyExercises() {
      const topicsSnapshot = await getDocs(
        collection(db, `learning_categories/${categoryId}/courses/${courseId}/topics`)
      );
      const topicDocs = sortDocsByOrder(topicsSnapshot.docs);
      const legacyExercises = [];

      for (const topicDoc of topicDocs) {
        const topic = topicDoc.data();
        const exerciseSnapshot = await getDocs(
          collection(db, `learning_categories/${categoryId}/courses/${courseId}/topics/${topicDoc.id}/exercises`)
        );
        const exerciseDocs = sortDocsByOrder(exerciseSnapshot.docs);

        for (const exerciseDoc of exerciseDocs) {
          const exercise = exerciseDoc.data();
          legacyExercises.push({
            urlId: `${topicDoc.id}__${exerciseDoc.id}`,
            title: exercise.title || 'Untitled Exercise',
            views: exercise.views || 0,
            topicName: topic.name || ''
          });
        }
      }

      return legacyExercises;
    }

    async function loadExercises() {
      const grid = document.getElementById('exercisesGrid');
      const courseProgress = document.getElementById('courseProgress');

      try {
        loadCompletedExerciseKeys();
        let fetchedExercises = await loadDirectExercises();
        if (!fetchedExercises.length) {
          fetchedExercises = await loadLegacyExercises();
        }
        allExercises = fetchedExercises;

        if (!allExercises.length) {
          if (courseProgress) courseProgress.textContent = '0/0 completed (0%)';
          grid.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">&#128221;</div>
              <h3>No exercises yet</h3>
              <p>Exercises will be added soon!</p>
            </div>
          `;
          return;
        }

        grid.innerHTML = '';
        let completedCount = 0;

        allExercises.forEach((exercise, index) => {
          const completed = isExerciseCompleted(exercise.urlId);
          if (completed) completedCount += 1;

          const card = document.createElement(isEnrolled ? 'a' : 'article');
          if (isEnrolled) {
            card.href = `exercise.html?category=${categoryId}&course=${courseId}&exercise=${encodeURIComponent(exercise.urlId)}`;
          }
          card.className = `exercise-card ${completed ? 'completed' : ''} ${!isEnrolled ? 'locked' : ''}`.trim();
          card.innerHTML = `
            <div class="exercise-number">${index + 1}</div>
            <div class="exercise-main">
              ${exercise.topicName ? `<span class="exercise-topic">${exercise.topicName}</span>` : ''}
              <h3 class="exercise-title">${exercise.title}</h3>
              <div class="exercise-meta">
                <span>\u{1F441} ${exercise.views} views</span>
              </div>
              ${!isEnrolled ? '<div class="exercise-lock-note">Enroll to unlock this exercise</div>' : ''}
            </div>
            <span class="exercise-arrow ${completed ? 'completed' : ''} ${!isEnrolled ? 'locked' : ''}" aria-hidden="true">${!isEnrolled ? '\u{1F512}' : (completed ? '\u{2713}' : '\u{2192}')}</span>
          `;
          if (!isEnrolled) {
            card.addEventListener('click', handleLockedExerciseClick);
          }
          grid.appendChild(card);
        });

        if (courseProgress) {
          const total = allExercises.length;
          const percent = total ? Math.round((completedCount / total) * 100) : 0;
          if (isEnrolled) {
            courseProgress.textContent = `${completedCount}/${total} completed (${percent}%)`;
          } else if (!currentUser) {
            courseProgress.textContent = `Preview mode: ${total} exercises available (login + enroll to unlock)`;
          } else {
            courseProgress.textContent = `Preview mode: ${total} exercises available (enroll to unlock)`;
          }
        }
      } catch (error) {
        console.error('Error loading exercises:', error);
        if (courseProgress) courseProgress.textContent = 'Progress unavailable';
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">&#9888;</div>
            <h3>Error loading exercises</h3>
            <p>${error.message}</p>
          </div>
        `;
      }
    }

    const openDrawer = document.getElementById('openDrawer');
    const closeDrawer = document.getElementById('closeDrawer');
    const drawer = document.getElementById('sideDrawer');
    const overlay = document.getElementById('drawerOverlay');

    if (openDrawer) {
      openDrawer.addEventListener('click', () => {
        drawer.classList.add('open');
        overlay.classList.add('show');
      });
    }

    if (closeDrawer) {
      closeDrawer.addEventListener('click', () => {
        drawer.classList.remove('open');
        overlay.classList.remove('show');
      });
    }

    if (overlay) {
      overlay.addEventListener('click', () => {
        drawer.classList.remove('open');
        overlay.classList.remove('show');
      });
    }

    async function initPage() {
      await loadCourse();
      await loadExercises();
      await loadVideos();
    }

    initPage();
    
    async function loadVideos() {
      const grid = document.getElementById('videosGrid');
      stopInlinePlayback();

      try {
        const videosSnapshot = await getDocs(
          collection(db, `learning_categories/${categoryId}/courses/${courseId}/videos`)
        );
        
        const videosList = [];
        videosSnapshot.docs.forEach(doc => {
          const data = doc.data();
          videosList.push({
            id: doc.id,
            ...data,
            order: data.order || 0
          });
        });
        
        videosList.sort((a, b) => parseOrder(a.order) - parseOrder(b.order));

        if (!videosList.length) {
          grid.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">&#127909;</div>
              <h3>No videos yet</h3>
              <p>Videos will be added soon!</p>
            </div>
          `;
          return;
        }

        grid.innerHTML = '';
        videosList.forEach((video) => {
          const card = document.createElement('article');
          card.className = 'video-card';

          const resolvedSource = resolveVideoSource(video);
          const thumbnailBtn = document.createElement('button');
          thumbnailBtn.type = 'button';
          thumbnailBtn.className = 'video-thumbnail';
          thumbnailBtn.setAttribute('aria-label', `Play ${video.title || 'video'}`);
          const inlinePlayer = document.createElement('div');
          inlinePlayer.className = 'video-inline-player';

          const thumbImg = document.createElement('img');
          thumbImg.className = 'video-thumb-img';
          thumbImg.loading = 'lazy';
          thumbImg.alt = `${video.title || 'Video'} thumbnail`;

          if (resolvedSource.type !== 'none') {
            thumbImg.src = resolvedSource.thumbnail || 'code_cloner_logo.jpeg';
            thumbnailBtn.addEventListener('click', () => playVideoInline(video, resolvedSource, thumbnailBtn, inlinePlayer));
          } else {
            thumbImg.src = 'code_cloner_logo.jpeg';
            thumbnailBtn.disabled = true;
          }

          const playChip = document.createElement('span');
          playChip.className = 'video-play-btn';
          playChip.textContent = resolvedSource.type !== 'none' ? 'Play Video' : 'Video unavailable';

          thumbnailBtn.appendChild(thumbImg);
          thumbnailBtn.appendChild(playChip);

          const info = document.createElement('div');
          info.className = 'video-info';

          const title = document.createElement('h3');
          title.className = 'video-title';
          title.textContent = video.title || 'Untitled Video';
          info.appendChild(title);

          if (video.description) {
            const desc = document.createElement('p');
            desc.className = 'video-desc';
            desc.textContent = video.description;
            info.appendChild(desc);
          }

          const meta = document.createElement('div');
          meta.className = 'video-meta';

          if (video.duration) {
            const durationBadge = document.createElement('span');
            durationBadge.className = 'video-badge';
            durationBadge.textContent = `\u{23F1} ${video.duration}`;
            meta.appendChild(durationBadge);
          }

          if (video.relatedToExercise) {
            const relatedBadge = document.createElement('span');
            relatedBadge.className = 'video-badge related';
            relatedBadge.textContent = '\u{1F517} Related to Exercise';
            meta.appendChild(relatedBadge);
          }

          if (resolvedSource.type === 'none') {
            const brokenBadge = document.createElement('span');
            brokenBadge.className = 'video-badge';
            brokenBadge.textContent = 'Invalid video link';
            meta.appendChild(brokenBadge);
          }

          info.appendChild(meta);

          card.appendChild(thumbnailBtn);
          card.appendChild(inlinePlayer);
          card.appendChild(info);
          grid.appendChild(card);
        });
      } catch (error) {
        console.error('Error loading videos:', error);
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">&#9888;</div>
            <h3>Error loading videos</h3>
            <p>${error.message}</p>
          </div>
        `;
      }
    }
    
    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const tabName = btn.dataset.tab;
        if (tabName !== 'videos') {
          stopInlinePlayback();
        }
        
        // Update buttons
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        // Update content
        document.querySelectorAll('.tab-content').forEach(content => {
          content.style.display = 'none';
        });
        document.getElementById(tabName + 'Tab').style.display = 'block';
      });
    });
  </script>
  <script type="module" src="ai-assistant.js"></script>
</body>
</html>
