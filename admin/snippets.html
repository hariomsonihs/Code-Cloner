<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Snippets — Code Cloner Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="admin.css"/>
  <script src="/env-config.js"></script>
</head>
<body class="admin-root">
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <img src="/code_cloner_logo.jpeg" alt="Logo" class="brand-logo"/>
    <div class="logo-text"><strong>Code Cloner</strong><small>Admin</small></div>
  </div>
  <div class="sidebar-section">Navigation</div>
  <a href="index.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Dashboard</a>
  <div class="sidebar-section">Content</div>
  <a href="articles.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>Articles</a>
  <a href="snippets.html" class="nav-item active"><svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>Snippets</a>
  <a href="tips.html" class="nav-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>Tips & Tricks</a>
  <a href="facts.html" class="nav-item"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>Facts</a>
  <a href="projects.html" class="nav-item"><svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>Projects</a>
  <a href="resources.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>Resources</a>
  <div class="sidebar-section">Media</div>
  <a href="media.html" class="nav-item"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>Media Library</a>
  <div class="sidebar-section">Import</div>
  <a href="rss-import.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg>RSS Import</a>
  <div class="sidebar-section">Engagement</div>
  <a href="engagement.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Comments &amp; Reactions</a>
  <div class="sidebar-section">Users</div>
  <a href="users.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Users</a>
  <div class="sidebar-section">Site</div>
  <a href="../index.html" class="nav-item" target="_blank"><svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>View Site</a>
  <div class="sidebar-footer">
    <div class="user-chip">
      <div class="user-avatar" id="userAvatar">A</div>
      <span class="user-email" id="userEmail"></span>
      <button class="logout-btn" id="logoutBtn" title="Logout"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
    </div>
  </div>
</aside>

<div class="main-wrap">
  <header class="topbar">
    <button class="hamburger" id="hamburger"><svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    <span class="topbar-title">💻 Code Snippets</span>
    <div class="topbar-actions">
      <button class="btn btn-primary btn-sm" id="showFormBtn"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>New Snippet</button>
    </div>
  </header>

  <div class="page-body">
    <!-- ADD / EDIT FORM -->
    <div class="card" id="formCard" style="display:none;margin-bottom:1.2rem">
      <div class="card-head">
        <h2 id="formTitle">New Snippet</h2>
        <button class="btn btn-soft btn-sm" id="cancelFormBtn">Cancel</button>
      </div>
      <div class="form-grid">
        <div class="field full"><label>Title *</label><input class="input" id="f-title" placeholder="Snippet title..." required/></div>
        <div class="field"><label>Category *</label><input class="input" id="f-category" placeholder="e.g. JavaScript"/></div>
        <div class="field"><label>Language</label>
          <select class="select" id="f-language">
            <option value="javascript">JavaScript</option>
            <option value="python">Python</option>
            <option value="java">Java</option>
            <option value="css">CSS</option>
            <option value="html">HTML</option>
            <option value="cpp">C++</option>
            <option value="csharp">C#</option>
            <option value="php">PHP</option>
            <option value="ruby">Ruby</option>
            <option value="go">Go</option>
          </select>
        </div>
        <div class="field full"><label>Description *</label><textarea class="textarea" id="f-description" rows="2" placeholder="Brief description..."></textarea></div>
        <!-- CODE FILES SECTION -->
        <div class="field full">
          <label style="display:flex;justify-content:space-between;align-items:center">
            <span>Code Files *</span>
            <button type="button" class="btn btn-primary btn-sm" id="addFileBtn">+ Add File</button>
          </label>
          <div id="codeFilesContainer" style="margin-top:.8rem;"></div>
        </div>
        <div class="field full"><label>Explanation</label><textarea class="textarea" id="f-explanation" rows="3" placeholder="Explain how this code works..."></textarea></div>
        <div class="field full"><label>YouTube Video URL <span style="font-weight:400;color:#888;font-size:.8rem">(optional)</span></label><input class="input" id="f-videoUrl" placeholder="https://youtube.com/watch?v=..."/></div>
        <div class="field"><label>Instagram Link <span style="font-weight:400;color:#888;font-size:.8rem">(optional)</span></label><input class="input" id="f-instagramUrl" placeholder="https://instagram.com/..."/></div>
        <div class="field"><label>LinkedIn Link <span style="font-weight:400;color:#888;font-size:.8rem">(optional)</span></label><input class="input" id="f-linkedinUrl" placeholder="https://linkedin.com/..."/></div>
      </div>

      <div class="action-row">
        <button class="btn btn-primary" id="saveBtn"><svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>Save Snippet</button>
        <button class="btn btn-soft" id="clearBtn">Clear</button>
      </div>
    </div>

    <!-- LIST -->
    <div class="card">
      <div class="card-head">
        <h2>All Snippets <span id="snippetCount" class="badge badge-blue" style="margin-left:.4rem">0</span></h2>
        <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">
          <input class="input" id="searchInput" placeholder="Search..." style="max-width:220px"/>
          <select class="select" id="categoryFilter" style="max-width:160px"><option value="">All Categories</option></select>
        </div>
      </div>
      <!-- Bulk action bar -->
      <div id="bulkBar" style="display:none;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.6rem .2rem;margin-bottom:.6rem;background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2);border-radius:10px;padding:.65rem 1rem">
        <span id="bulkCount" style="font-size:.88rem;font-weight:600;color:var(--red)">0 selected</span>
        <button class="btn btn-danger btn-sm" id="bulkDeleteBtn">🗑 Delete Selected</button>
        <button class="btn btn-soft btn-sm" id="bulkClearBtn">✕ Clear Selection</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th style="width:36px"><input type="checkbox" id="selectAll" title="Select all"/></th>
            <th>Title</th><th>Category</th><th>Language</th><th>Date</th><th>Actions</th>
          </tr></thead>
          <tbody id="snippetList"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { saveNotification } from "./notif-helper.js";

const cfg = window.__env || {};
const app = initializeApp(cfg);
const db = getFirestore(app);
const auth = getAuth(app);

onAuthStateChanged(auth, user => {
  if (!user) { window.location.href = "index.html"; return; }
  document.getElementById("userEmail").textContent = user.email;
  document.getElementById("userAvatar").textContent = user.email[0].toUpperCase();
  document.body.classList.add("ready");
});
document.getElementById("logoutBtn").addEventListener("click", () => signOut(auth).then(() => location.href = "index.html"));

// Sidebar
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("sidebarOverlay");
document.getElementById("hamburger").addEventListener("click", () => { sidebar.classList.toggle("open"); overlay.classList.toggle("show"); });
overlay.addEventListener("click", () => { sidebar.classList.remove("open"); overlay.classList.remove("show"); });

// Form toggle
const formCard = document.getElementById("formCard");
document.getElementById("showFormBtn").addEventListener("click", () => { editId = null; resetForm(); formCard.style.display = "block"; document.getElementById("formTitle").textContent = "New Snippet"; formCard.scrollIntoView({behavior:"smooth"}); });
document.getElementById("cancelFormBtn").addEventListener("click", () => { formCard.style.display = "none"; resetForm(); });

function esc(t){return String(t??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");}
function toast(msg,type="success"){
  let w=document.getElementById("tw"); if(!w){w=document.createElement("div");w.id="tw";w.className="toast-wrap";document.body.appendChild(w);}
  const icons={success:`<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>`,error:`<svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>`};
  const el=document.createElement("div"); el.className=`toast toast-${type}`; el.innerHTML=(icons[type]||"")+msg; w.appendChild(el); setTimeout(()=>el.remove(),3200);
}
function formatDate(ts){if(!ts)return"—";const d=ts.toDate?ts.toDate():new Date(ts);return d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});}

let editId = null;
let allDocs = [];

let codeFiles = [];

function resetForm() {
  ["f-title","f-category","f-language","f-description","f-explanation","f-videoUrl","f-instagramUrl","f-linkedinUrl"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("f-language").value = "javascript";
  codeFiles = [];
  renderCodeFiles();
  editId = null;
}

function renderCodeFiles() {
  const container = document.getElementById("codeFilesContainer");
  if (!codeFiles.length) {
    container.innerHTML = `<div style="padding:1rem;background:rgba(95,142,255,.05);border:1px dashed rgba(95,142,255,.3);border-radius:8px;text-align:center;color:#888">No files added. Click "+ Add File" to add code files.</div>`;
    return;
  }
  container.innerHTML = codeFiles.map((file, idx) => `
    <div class="code-file-card" style="margin-bottom:.8rem;border:1px solid var(--line);border-radius:10px;padding:1rem;background:var(--surface)">
      <div style="display:flex;gap:.6rem;margin-bottom:.6rem;align-items:center;flex-wrap:wrap">
        <input class="input" value="${file.name}" onchange="updateFileName(${idx},this.value)" placeholder="filename.js" style="flex:1;min-width:150px"/>
        <select class="select" onchange="updateFileLang(${idx},this.value)" style="width:130px">
          <option value="javascript" ${file.language==='javascript'?'selected':''}>JavaScript</option>
          <option value="python" ${file.language==='python'?'selected':''}>Python</option>
          <option value="java" ${file.language==='java'?'selected':''}>Java</option>
          <option value="css" ${file.language==='css'?'selected':''}>CSS</option>
          <option value="html" ${file.language==='html'?'selected':''}>HTML</option>
          <option value="cpp" ${file.language==='cpp'?'selected':''}>C++</option>
          <option value="csharp" ${file.language==='csharp'?'selected':''}>C#</option>
          <option value="php" ${file.language==='php'?'selected':''}>PHP</option>
          <option value="ruby" ${file.language==='ruby'?'selected':''}>Ruby</option>
          <option value="go" ${file.language==='go'?'selected':''}>Go</option>
          <option value="typescript" ${file.language==='typescript'?'selected':''}>TypeScript</option>
          <option value="sql" ${file.language==='sql'?'selected':''}>SQL</option>
        </select>
        <button type="button" class="btn btn-danger btn-sm" onclick="removeFile(${idx})">Delete</button>
      </div>
      <textarea class="textarea" rows="10" onchange="updateFileCode(${idx},this.value)" placeholder="Paste code here..." style="font-family:'Fira Code',monospace;font-size:.85rem">${file.code}</textarea>
    </div>
  `).join('');
}

window.updateFileName = function(idx, val) { codeFiles[idx].name = val; };
window.updateFileLang = function(idx, val) { codeFiles[idx].language = val; };
window.updateFileCode = function(idx, val) { codeFiles[idx].code = val; };
window.removeFile = function(idx) { codeFiles.splice(idx, 1); renderCodeFiles(); };

document.getElementById("addFileBtn").addEventListener("click", () => {
  codeFiles.push({ name: `file${codeFiles.length + 1}.js`, language: "javascript", code: "" });
  renderCodeFiles();
});

document.getElementById("clearBtn").addEventListener("click", resetForm);

document.getElementById("saveBtn").addEventListener("click", async () => {
  const title = document.getElementById("f-title").value.trim();
  const category = document.getElementById("f-category").value.trim();
  const description = document.getElementById("f-description").value.trim();

  if (!title || !category || !description) { toast("Title, Category and Description are required.", "error"); return; }
  if (!codeFiles.length) { toast("At least one code file is required.", "error"); return; }

  for (let i = 0; i < codeFiles.length; i++) {
    if (!codeFiles[i].name.trim()) { toast(`File ${i+1}: Filename is required.`, "error"); return; }
    if (!codeFiles[i].code.trim()) { toast(`File ${i+1}: Code is required.`, "error"); return; }
  }

  const data = {
    title, category,
    language: document.getElementById("f-language").value,
    description,
    codeFiles: codeFiles.map(f => ({ name: f.name.trim(), language: f.language, code: f.code.trim() })),
    code: codeFiles[0]?.code || '',
    explanation: document.getElementById("f-explanation").value.trim(),
    videoUrl: document.getElementById("f-videoUrl").value.trim(),
    instagramUrl: document.getElementById("f-instagramUrl").value.trim(),
    linkedinUrl: document.getElementById("f-linkedinUrl").value.trim(),
  };

  try {
    if (editId) {
      await updateDoc(doc(db, "snippets", editId), data);
      toast("Snippet updated ✓");
    } else {
      data.createdAt = serverTimestamp();
      const ref = await addDoc(collection(db, "snippets"), data);
      await saveNotification(data.title, data.category, "snippets", ref.id);
      toast("Snippet published ✓");
    }
    formCard.style.display = "none";
    resetForm();
  } catch(e) { toast("Error: " + e.message, "error"); }
});

// List
const searchInput = document.getElementById("searchInput");
const categoryFilter = document.getElementById("categoryFilter");
searchInput.addEventListener("input", renderList);
categoryFilter.addEventListener("change", renderList);

let selectedIds = new Set();

function updateBulkBar() {
  const bar = document.getElementById("bulkBar");
  const count = selectedIds.size;
  bar.style.display = count > 0 ? "flex" : "none";
  document.getElementById("bulkCount").textContent = count + " selected";
}

document.getElementById("selectAll").addEventListener("change", function() {
  const checkboxes = document.querySelectorAll(".row-check");
  checkboxes.forEach(cb => {
    cb.checked = this.checked;
    if (this.checked) selectedIds.add(cb.dataset.id);
    else selectedIds.delete(cb.dataset.id);
  });
  updateBulkBar();
});

document.getElementById("bulkDeleteBtn").addEventListener("click", async () => {
  if (!selectedIds.size) return;
  if (!confirm(`Delete ${selectedIds.size} selected snippet(s)? This cannot be undone.`)) return;
  const ids = [...selectedIds];
  let done = 0;
  for (const id of ids) {
    try { await deleteDoc(doc(db, "snippets", id)); done++; } catch {}
  }
  selectedIds.clear();
  updateBulkBar();
  document.getElementById("selectAll").checked = false;
  toast(`${done} snippet(s) deleted ✓`);
});

document.getElementById("bulkClearBtn").addEventListener("click", () => {
  selectedIds.clear();
  document.querySelectorAll(".row-check").forEach(cb => cb.checked = false);
  document.getElementById("selectAll").checked = false;
  updateBulkBar();
});

onSnapshot(query(collection(db, "snippets"), orderBy("createdAt","desc")), snap => {
  allDocs = snap.docs.map(d => ({id:d.id,...d.data()}));
  document.getElementById("snippetCount").textContent = allDocs.length;
  // Populate category filter
  const cats = [...new Set(allDocs.map(d => d.category).filter(Boolean))];
  const cf = document.getElementById("categoryFilter");
  const prev = cf.value;
  cf.innerHTML = `<option value="">All Categories</option>` + cats.map(c => `<option value="${esc(c)}" ${prev===c?'selected':''}>${esc(c)}</option>`).join("");
  renderList();
});

function renderList() {
  const q = searchInput.value.toLowerCase();
  const cat = categoryFilter.value;
  const filtered = allDocs.filter(d => {
    const matchQ = !q || (d.title+d.category+d.language).toLowerCase().includes(q);
    const matchC = !cat || d.category === cat;
    return matchQ && matchC;
  });
  const tbody = document.getElementById("snippetList");
  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg><p>No snippets found.</p></div></td></tr>`;
    return;
  }
  tbody.innerHTML = filtered.map(d => `
    <tr>
      <td><input type="checkbox" class="row-check" data-id="${d.id}" ${selectedIds.has(d.id)?'checked':''} onchange="toggleSelect('${d.id}',this.checked)"/></td>
      <td><div class="td-title">${esc(d.title)}</div></td>
      <td><span class="badge badge-blue">${esc(d.category)}</span></td>
      <td><span class="badge badge-gray">${esc(d.language||"—")}</span></td>
      <td class="td-muted">${formatDate(d.createdAt)}</td>
      <td>
        <div style="display:flex;gap:.4rem;flex-wrap:wrap">
          <button class="btn btn-green btn-sm" onclick="editDoc('${d.id}')">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="delDoc('${d.id}')">Delete</button>
        </div>
      </td>
    </tr>`).join("");
}

window.toggleSelect = function(id, checked) {
  if (checked) selectedIds.add(id); else selectedIds.delete(id);
  updateBulkBar();
  const all = document.querySelectorAll(".row-check");
  document.getElementById("selectAll").checked = all.length > 0 && [...all].every(c => c.checked);
};

window.editDoc = function(id) {
  const d = allDocs.find(x => x.id === id); if(!d) return;
  editId = id;
  document.getElementById("f-title").value = d.title||"";
  document.getElementById("f-category").value = d.category||"";
  document.getElementById("f-language").value = d.language||"javascript";
  document.getElementById("f-description").value = d.description||"";
  document.getElementById("f-explanation").value = d.explanation||"";
  document.getElementById("f-videoUrl").value = d.videoUrl||"";
  document.getElementById("f-instagramUrl").value = d.instagramUrl||"";
  document.getElementById("f-linkedinUrl").value = d.linkedinUrl||"";

  if (d.codeFiles && d.codeFiles.length) {
    codeFiles = d.codeFiles.map(f => ({ name: f.name, language: f.language, code: f.code }));
  } else if (d.code) {
    codeFiles = [{ name: "code." + (d.language || "js"), language: d.language || "javascript", code: d.code }];
  } else {
    codeFiles = [];
  }
  renderCodeFiles();

  document.getElementById("formTitle").textContent = "Edit Snippet";
  formCard.style.display = "block";
  formCard.scrollIntoView({behavior:"smooth"});
};

window.delDoc = async function(id) {
  if(!confirm("Delete this snippet?")) return;
  try { await deleteDoc(doc(db,"snippets",id)); toast("Deleted ✓"); } catch(e){ toast(e.message,"error"); }
};
</script>
</body>
</html>
